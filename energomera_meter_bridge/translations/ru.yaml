configuration:
  meter_host:
    name: "IP-адрес TCP-шлюза счётчика"
    description: "IP-адрес шлюза, подключённого к счётчику (например, 192.168.10.250)"
  meter_port:
    name: "TCP-порт шлюза"
    description: "TCP-порт шлюза (обычно 1111)"
  meter_address:
    name: "Сетевой адрес счётчика"
    description: "Сетевой адрес (IDPAS) счётчика. Заводское значение: 777777"
  meter_password:
    name: "Пароль счётчика"
    description: "Пароль администратора счётчика. Заводское значение: 777777. Для чтения не требуется, если в счётчике разрешено беспарольное выборочное чтение"
  read_mode:
    name: "Режим чтения"
    description: "fast — быстрое выборочное чтение вне сеанса, пароль не нужен, но поддерживается не всеми счётчиками; session — сессия обмена в режиме программирования, как в 1.0.4; array — сеанс в режиме чтения, счётчик сам отдаёт весь массив параметров (цикл ≈21 с, нужен poll_timeout 90–120 с и poll_interval от 90 с)"
  use_address:
    name: "Адресный кадр быстрого чтения"
    description: "Отправлять кадры чтения с сетевым адресом счётчика (/?<адрес>!...). Включите, если TCP-шлюз обслуживает несколько счётчиков на одной шине"
  emulate_parity:
    name: "Эмуляция чётности 7E1 в 8N1"
    description: "Устанавливать 8-й бит у байтов с нечётной чётностью. Оставьте включённым для шлюзов, эмулирующих 7E1; выключите для прозрачных 8N1-шлюзов"
  mqtt_host:
    name: "Адрес MQTT-брокера"
    description: "Адрес MQTT-брокера (localhost, если Mosquitto работает на этом же хосте)"
  mqtt_port:
    name: "Порт MQTT-брокера"
    description: "Порт MQTT-брокера (по умолчанию 1883, для TLS обычно 8883)"
  mqtt_user:
    name: "Пользователь MQTT"
    description: "Имя пользователя для подключения к MQTT"
  mqtt_password:
    name: "Пароль MQTT"
    description: "Пароль для подключения к MQTT"
  mqtt_tls:
    name: "Использовать TLS для MQTT"
    description: "Включить шифрование TLS при подключении к MQTT"
  topic_prefix:
    name: "Префикс топиков MQTT"
    description: "Префикс для всех MQTT-топиков, публикуемых дополнением (например, main_home_meter)"
  node_id:
    name: "Идентификатор устройства в discovery"
    description: "Идентификатор для discovery-топиков. Оставьте пустым для автоматического формирования из адреса счётчика"
  poll_interval:
    name: "Интервал быстрого опроса (секунды)"
    description: "Как часто читать быстрые параметры: мощность, напряжение, ток"
  slow_poll_interval:
    name: "Интервал медленного опроса (секунды)"
    description: "Как часто читать архивы: суточный расход и месячные максимумы мощности"
  poll_timeout:
    name: "Таймаут ответа счётчика (секунды)"
    description: "Максимальное время ожидания ответа от счётчика. В режиме array сюда входит вычитка всего массива — ставьте 90–120 с"
  log_level:
    name: "Уровень журнала"
    description: "info — обычный журнал; debug — кадры обмена в HEX, тайминги и разбор ответов для диагностики; warning — только проблемы"
  device_name:
    name: "Имя устройства"
    description: "Отображаемое имя устройства в Home Assistant"
  device_model:
    name: "Модель устройства"
    description: "Модель счётчика (например, CE301)"
  device_manufacturer:
    name: "Производитель"
    description: "Производитель счётчика (например, Energomera)"
  device_sw_version:
    name: "Версия прошивки"
    description: "Версия прошивки счётчика (например, v11)"
  read_energy:
    name: "Читать текущую энергию"
    description: "Читать накопленную активную энергию (ET0PE)"
  read_power:
    name: "Читать активную мощность"
    description: "Читать мгновенную активную мощность (POWEP)"
  read_voltage:
    name: "Читать напряжение по фазам"
    description: "Читать напряжение для фаз A, B и C (VOLTA)"
  read_current:
    name: "Читать ток по фазам"
    description: "Читать ток для фаз A, B и C (CURRE)"
  read_monthly_archive:
    name: "Читать месячный архив"
    description: "Читать энергию на конец предыдущего месяца (ENMPE)"
  read_daily_archive:
    name: "Читать суточный расход"
    description: "Читать расход энергии за каждый из последних 7 дней (EADPE)"
  read_max_power:
    name: "Читать месячные максимумы мощности"
    description: "Читать максимальную активную мощность за текущий месяц (MAXPE)"
  read_device_info:
    name: "Читать сведения об устройстве"
    description: "Заводской номер счётчика, сетевой адрес и модель. В режиме array они лежат в конце массива, поэтому раз в сутки один цикл читается дольше; результат кэшируется в /data и попадает в карточку устройства"