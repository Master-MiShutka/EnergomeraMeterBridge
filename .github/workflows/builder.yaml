name: Builder

# Сборка и публикация образов приложения в GitHub Container Registry (GHCR).
#
# Что происходит при пуше в main (если изменилось приложение или этот файл):
#   1. prepare  — читает energomera_meter_bridge/config.yaml (arch, image, version,
#                 name, description, url) и готовит матрицу сборки;
#   2. build    — параллельно собирает образы amd64 и aarch64, подписывает их
#                 через Cosign и публикует в GHCR;
#   3. manifest — объединяет образы архитектур в один multi-arch манифест
#                 ghcr.io/<владелец>/energomera-meter-bridge:<version> и :latest.
#
# Тег образа берётся из version в config.yaml, поэтому повторный пуш без поднятия
# версии ничего не публикует (skip-existing) — но образ при этом пересобирается.
#
# ВАЖНО: после первого успешного прогона пакет в GHCR нужно сделать публичным
# (GitHub → Packages → energomera-meter-bridge → Package settings → Change
# visibility → Public), иначе Supervisor не сможет скачать образ без авторизации.

on:
  push:
    branches:
      - main
    paths:
      - "energomera_meter_bridge/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Подготовка сборки
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./energomera_meter_bridge"

      - name: Normalize app information
        id: normalize
        run: |
          image="${{ steps.info.outputs.image }}"
          if [[ -z "${image}" || "${image}" == "null" ]]; then
            echo "::error::В config.yaml не задано поле image — образы публиковать некуда"
            exit 1
          fi
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.info.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.info.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "description=${{ steps.info.outputs.description }}" >> "$GITHUB_OUTPUT"
          url="${{ steps.info.outputs.url }}"
          if [[ -n "${url}" && "${url}" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Образ ${{ matrix.arch }}
    needs: prepare
    # Раннер выбирает матрица: amd64 собирается на ubuntu-24.04,
    # aarch64 — на ubuntu-24.04-arm (ARM-раннеры GitHub бесплатны для
    # публичных репозиториев).
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # подпись образа через Cosign (OIDC-токен GitHub)
      packages: write # публикация в GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./energomera_meter_bridge"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: "true"
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Multi-arch манифест
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
