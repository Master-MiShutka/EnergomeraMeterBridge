- title: 'Энергия: расходы и экономия'
  path: energy
  icon: mdi:lightning-bolt
  cards:
  - type: entities
    title: Расход по розеткам
    state_color: true
    entities:
    - entity: script.energy_plugs_refresh
      name: Обновить список розеток
    - type: button
      name: Перезагрузить шаблоны
      icon: mdi:reload
      tap_action:
        action: perform-action
        perform_action: template.reload
  - type: custom:auto-entities
    card:
      type: entities
      title: 'Розетки: расход и стоимость за месяц'
      state_color: true
    filter:
      include:
      - entity_id: regex:.*_(cost|energy)_month$
      exclude:
      - entity_id: regex:^sensor\.(house|gran|obshchii|energomera)
    sort:
      method: state
      numeric: true
      reverse: true
  - type: markdown
    content: "{% set hour = now().hour -%}\n{% set t1 = states('input_number.tariff_t1') | float(0) -%}\n{% set t2 = states('input_number.tariff_t2') | float(0) -%}\n{% set t3 = states('input_number.tariff_t3') | float(0) -%}\n{% set free_day = is_state('binary_sensor.meter_free_day', 'on') -%}\n{% set\
      \ zone = 'T2' if free_day else ('T1' if hour >= 17 and hour < 23 else ('T2' if hour >= 23 or hour < 6 else 'T3')) -%}\n{% set left = namespace(h=0) -%}\n{% for i in range(1, 25) -%}\n  {% if left.h == 0 and (hour + i) % 24 in [6, 17, 23] -%}\n    {% set left.h = i -%}\n  {% endif -%}\n{% endfor\
      \ -%}\n## Тарифы на электроэнергию\n\n{% if free_day -%}\nСегодня **выходной или праздник**: весь день действует **T2** —\n{{ states('sensor.current_electricity_price') }} BYN за кВт·ч, до конца суток.\n{% else -%}\nСейчас действует **{{ zone }}** — {{ states('sensor.current_electricity_price')\
      \ }} BYN за кВт·ч,\nдо смены зоны {{ left.h }} ч.\n{% endif -%}\n\n| Тариф | Когда действует | Цена, BYN/кВт·ч | Сейчас |\n|:--|:--|--:|:--:|\n| **T1** — максимальные нагрузки (пик) | 17:00–23:00. Самая дорогая зона: вечером одновременно включаются плита, бойлер и обогреватели | {{ t1 }} | {{ '←\
      \ сейчас' if zone == 'T1' else '—' }} |\n| **T2** — минимальные нагрузки (ночь) | 23:00–06:00. Самая дешёвая зона: выгодно греть бойлер, стирать и заряжать EV | {{ t2 }} | {{ '← сейчас' if zone == 'T2' else '—' }} |\n| **T3** — остальное время суток (полупик) | 06:00–17:00. Дневная зона, цена между\
      \ T2 и T1 | {{ t3 }} | {{ '← сейчас' if zone == 'T3' else '—' }} |\n\n**Выходные и исключённые дни.** У счётчика тариф переключается сам: по\nбудням — по расписанию зон, а в субботу, воскресенье и в свои\nисключённые дни — целиком на график 2 (минимальные нагрузки). Счётчик\nразличает только день\
      \ недели и девять своих дат: объявленные рабочими\nсубботы он считает выходными, а перенесённые выходные в будни — обычными\nднями.\nИсключённые дни в счётчике заданы фиксированно: 01.01, 02.01, 07.01,\n08.03, 01.05, 09.05, 03.07, 07.11, 25.12. В такие дни переносить\nнагрузку на ночь бессмысленно:\
      \ она и так идёт по дешёвому тарифу.\nОпределяет день бинарный сенсор `binary_sensor.meter_free_day`;\nРадуницу и объявленные переносы (их счётчик знать не может) можно\nдобавить в `input_text.extra_nonwork_days` — тогда расчёт пойдёт строго\nпо постановлению, а не по показаниям счётчика.\n\nЭто\
      \ тарифные регистры счётчика: он накапливает энергию отдельно по каждой\nзоне, поэтому расход и деньги по T1, T2 и T3 считаются точно, без деления\nсуммарного потребления на глаз. Цены обновляются автоматизацией из\nтарифов для населения (см. `examples/tariff_automation.yaml`), а\n`sensor.current_electricity_price`\
      \ подставляет действующую цену по часам —\nеё используют отдельные устройства в панели «Энергия».\n\nСверьте границы зон с программированием тарифов в вашем счётчике: если\nночь у него записана, например, в T3, поменяйте подписи и порядок цен,\nиначе стоимость посчитается неверно.\n"
  - type: markdown
    content: "{% set t1 = states('input_number.tariff_t1') | float(0) -%}\n{% set t2 = states('input_number.tariff_t2') | float(0) -%}\n{% set ratio = (t1 / t2) | round(1) if t2 > 0 else 0 -%}\n{% set devices = [('Бойлер', 'boiler', 'sensor.0xa4c138f501c578e3_power'),\n                  ('Греющий кабель',\
      \ 'heating_cable', 'sensor.rozetka_greiushchii_kabel_potrebliaemaia_moshchnost'),\n                  ('Конвектор мансарда', 'attic_convector', 'sensor.cuco_v2eur_0717_electric_power'),\n                  ('Зарядка EV', 'ev_charging',\n                   'sensor.ev_charging_power_kw')] -%}\n{% set\
      \ ns = namespace(saving=0) -%}\n## Что можно сэкономить\n\n{% if t2 <= 0 -%}\nЦены на электроэнергию ещё не заполнены: нажмите кнопку **«Обновить цены на\nэлектроэнергию»** (или впишите их в `input_number.tariff_t1…t3`). После этого\nздесь появится расчёт — сколько стоит час работы каждого прибора\
      \ и сколько\nможно сэкономить, перенеся нагрузку в ночную зону T2.\n{% else -%}\nНочная зона **T2** дешевле пика **T1** в {{ ratio }} раза ({{ t1 }} против {{ t2 }} BYN\nза кВт·ч), поэтому перенос нагрузки с вечера на ночь — самый простой способ\nснизить счёт, не отказываясь от comfortа.\n\n| Прибор\
      \ | Час работы сейчас | Час работы в T2 | За месяц | Экономия, если всё в T2 |\n|:--|--:|--:|--:|--:|\n{% for label, key, power in devices -%}\n{% set raw = states(power) | float(0) -%}\n{% set kw = raw / 1000 if state_attr(power, 'unit_of_measurement') == 'W' else raw -%}\n{% set kwh = states('sensor.'\
      \ ~ key ~ '_energy_month') | float(0) -%}\n{% set cost = states('sensor.' ~ key ~ '_cost_month') | float(0) -%}\n{% set avg = (cost / kwh) if kwh > 0 else 0 -%}\n{% set save = ((kwh * (avg - t2)) | round(2)) if avg > t2 else 0 -%}\n{% set ns.saving = ns.saving + save -%}\n| {{ label }} | {{ '%.3f'\
      \ % (kw * t1) }} BYN | {{ '%.3f' % (kw * t2) }} BYN | {{ '%.1f' % kwh }} кВт·ч | до {{ '%.2f' % save }} BYN |\n{% endfor -%}\n| **Итого** | | | | **до {{ '%.2f' % ns.saving }} BYN** |\n\n**Зарядка EV**{% if is_state('binary_sensor.ev_charging_in_progress', 'on') %} — идёт зарядка{% endif %}:\n{{\
      \ '%.2f' % (states('sensor.ev_charging_power_kw') | float(0)) }} кВт,\nстоимость текущей сессии {{ '%.2f' % (states('sensor.ev_charging_session_cost') | float(0)) }} BYN.\nЗа месяц {{ '%.1f' % (states('sensor.ev_charging_energy_month') | float(0)) }} кВт·ч\nна {{ '%.2f' % (states('sensor.ev_charging_cost_month')\
      \ | float(0)) }} BYN;\nэкономия относительно пика — {{ '%.2f' % (states('sensor.ev_charging_saving_month') | float(0)) }} BYN.\n\nВ субботу, воскресенье и исключённые дни счётчика переносить ничего не\nнужно: весь день идёт по T2 (см. таблицу тарифов выше).\n\n**Что сделать**\n\n* бойлер — таймер\
      \ с 23:00 до 06:00, в пик 17:00–23:00 не греть;\n* стиральную и посудомоечную машины, зарядку EV — отложенный старт на 23:00;\n* тёплый пол и греющий кабель — на ночь: бетон держит тепло до утра;\n* конвектор мансарды — включать до 17:00 или после 23:00;\n* крупные разовые дела (рендер, стирка,\
      \ зарядка) — планировать на T2, а не на вечер.\n\nОценка «если всё в T2» — верхняя граница: часть энергии перенести нельзя\n(холодильник, освещение, готовка). Средняя уплаченная цена считается как\n«затраты прибора за месяц ÷ его расход за месяц», поэтому цифры уточняются\nпо мере накопления статистики.\n\
      {% endif -%}\n"
  - type: markdown
    content: '## Расход по розеткам


      Столбцы — расход за сутки по каждой розетке. Данные берутся из

      накопительных сенсоров энергии самих розеток, поэтому история есть

      ровно с того момента, как они начали записываться.

      '
