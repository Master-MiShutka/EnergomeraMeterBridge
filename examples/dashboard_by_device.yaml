# ============================================================================
#  Электроэнергия по устройствам
#
#  Это выгрузка рабочей панели Home Assistant в формате YAML — на случай
#  восстановления и как пример готовой вёрстки.
#
#  Куда вставлять: Настройки → Панели → «+ Добавить панель» → «Новый дашборд из
#  пустого» → открыть → ⋮ → «Редактировать панель» → ⋮ → «Raw-редактор» → вставить
#  содержимое ниже.
#
#  Вкладок: 4. Сущности берутся из пакетов examples/energy_devices.yaml,
#  examples/energy_helpers.yaml и (для вкладок зарядки) из интеграции
#  ev_charging_costs.
# ============================================================================

