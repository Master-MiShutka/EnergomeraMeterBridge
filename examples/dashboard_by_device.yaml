- title: Месяц
  path: month
  icon: mdi:calendar-month
  cards:
  - type: markdown
    content: "{% set devices = [('Бойлер', 'boiler'), ('Греющий кабель', 'heating_cable'),\n                  ('Конвектор мансарда', 'attic_convector'), ('Компьютер', 'pc'),\n                  ('Зарядка EV', 'ev_charging')] -%}\n{% set ns = namespace(now=0, prev=0) -%}\n## Затраты по месяцам\n\n### {{\
      \ states('sensor.house_cost_month') | float(0) | round(2) }} BYN с начала месяца\n\nПрошлый месяц по дому: **{{ states('sensor.house_cost_prev_month') | float(0) | round(2) }} BYN**.\n\n| Устройство | Текущий месяц, BYN | Прошлый месяц, BYN |\n|:--|--:|--:|\n{% for label, key in devices -%}\n{%\
      \ set now = states('sensor.' ~ key ~ '_cost_month') | float(0) -%}\n{% set prev = states('sensor.' ~ key ~ '_cost_last_month') | float(states('input_number.' ~ key ~ '_cost_last_month') | float(0)) -%}\n{% set ns.now = ns.now + now -%}\n{% set ns.prev = ns.prev + prev -%}\n| {{ label }} | {{ now\
      \ | round(2) }} | {{ prev | round(2) }} |\n{% endfor -%}\n| **Итого по устройствам** | **{{ ns.now | round(2) }}** | **{{ ns.prev | round(2) }}** |\n"
  - type: markdown
    content: "{% set devices = [('Бойлер', 'boiler'), ('Греющий кабель', 'heating_cable'),\n                  ('Конвектор мансарда', 'attic_convector'), ('Компьютер', 'pc'),\n                  ('Зарядка EV', 'ev_charging')] -%}\n{% set ns = namespace(month=0, total=0) -%}\n## Экономия на тарифах\n\nСчитается\
      \ как мощность × (цена пика − действующая цена): в зоне T1 ноль,\nв T2 и T3 копится. Это «сколько не заплачено из-за того, что нагрузка\nработала не в пик», а не выписка из банка.\n\nДом целиком: **{{ states('sensor.house_savings_month') | float(0) | round(2) }} BYN**\nза текущий месяц, {{ states('sensor.house_savings_prev_month')\
      \ | float(0) | round(2) }} BYN\nза прошлый, {{ states('sensor.house_savings_total') | float(0) | round(0) }} BYN\nза всю историю счётчика (оценка: при смене тарифов история пересчитывается\nпо новым ценам).\n\n| Прибор | За месяц, BYN | Всего, BYN |\n|:--|--:|--:|\n{% for label, key in devices -%}\n\
      {% set month = states('sensor.' ~ key ~ '_saving_month') | float(0) -%}\n{% set total = states('sensor.' ~ key ~ '_savings_total') | float(0) -%}\n{% set ns.month = ns.month + month -%}\n{% set ns.total = ns.total + total -%}\n| {{ label }} | {{ '%.2f' % month }} | {{ '%.2f' % total }} |\n{% endfor\
      \ -%}\n| **Итого по устройствам** | **{{ '%.2f' % ns.month }}** | **{{ '%.2f' % ns.total }}** |\n\nХотите больше — включайте таймеры: блок «Что можно сэкономить» на вкладке\n«Энергия» показывает, сколько даст перенос каждой нагрузки в ночную зону.\n"
  - type: statistics-graph
    title: Затраты по месяцам, BYN
    chart_type: bar
    period: month
    days_to_show: 400
    stat_types:
    - change
    entities:
    - entity: sensor.boiler_cost_total
      name: Бойлер
    - entity: sensor.heating_cable_cost_total
      name: Греющий кабель
    - entity: sensor.attic_convector_cost_total
      name: Конвектор мансарда
    - entity: sensor.pc_cost_total
      name: Компьютер
  - type: statistics-graph
    title: Экономия по месяцам, BYN
    chart_type: bar
    period: month
    days_to_show: 400
    stat_types:
    - change
    entities:
    - entity: sensor.boiler_savings_total
      name: Бойлер
    - entity: sensor.heating_cable_savings_total
      name: Греющий кабель
    - entity: sensor.attic_convector_savings_total
      name: Конвектор мансарда
    - entity: sensor.pc_savings_total
      name: Компьютер
