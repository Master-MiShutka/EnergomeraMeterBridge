# ============================================================================
#  Интернет: скорость и объёмы потребления (роутер OpenWrt, ByFly Gateway)
#
#  Источник — интеграция openwrt_mqtt: она публикует метрики роутера в MQTT и
#  создаёт по ним датчики. WAN у вас — интерфейс pppoe-byfly:
#    sensor.byflygateway_pppoe_byfly_rx      (байты, всего)
#    sensor.byflygateway_pppoe_byfly_tx      (байты, всего)
#    sensor.byflygateway_pppoe_byfly_rx_rate    (скорость, Б/с)
#    sensor.byflygateway_pppoe_byfly_tx_rate    (скорость, Б/с)
#
#  Здесь — только производные для удобного отображения:
#    * скорость в Мбит/с (Б/с × 8 / 1e6);
#    * объёмы в ГБ (байты / 1e9) со state_class total_increasing, чтобы их
#      можно было использовать источником для счётчиков за сутки и месяц.
#
#  Счётчики объёмов созданы через интерфейс HA (utility_meter):
#    sensor.internet_priniato_za_sutki / _za_mesiats
#    sensor.internet_otdano_za_sutki   / _za_mesiats
# ============================================================================

template:
  - sensor:
      - name: "Интернет: скорость приёма"
        unique_id: internet_wan_rx_speed
        unit_of_measurement: "Mbit/s"
        device_class: data_rate
        state_class: measurement
        icon: mdi:download-network
        state: "{{ (states('sensor.byflygateway_pppoe_byfly_rx_rate') | float(0) * 8 / 1000000) | round(2) }}"

      - name: "Интернет: скорость отдачи"
        unique_id: internet_wan_tx_speed
        unit_of_measurement: "Mbit/s"
        device_class: data_rate
        state_class: measurement
        icon: mdi:upload-network
        state: "{{ (states('sensor.byflygateway_pppoe_byfly_tx_rate') | float(0) * 8 / 1000000) | round(2) }}"

      - name: "Интернет: принято, ГБ"
        unique_id: internet_wan_rx_gb
        unit_of_measurement: "GB"
        device_class: data_size
        state_class: total_increasing
        icon: mdi:download-network
        state: "{{ (states('sensor.byflygateway_pppoe_byfly_rx') | float(0) / 1000000000) | round(3) }}"

      - name: "Интернет: отдано, ГБ"
        unique_id: internet_wan_tx_gb
        unit_of_measurement: "GB"
        device_class: data_size
        state_class: total_increasing
        icon: mdi:upload-network
        state: "{{ (states('sensor.byflygateway_pppoe_byfly_tx') | float(0) / 1000000000) | round(3) }}"
